<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Otabek Pulatov, MD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }

body{
  min-height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#0b1420;font-family:'DM Sans',-apple-system,sans-serif;
  color:#fff;text-align:center;padding:2rem;
}

/* ambient glow, slowly breathing */
body::before{
  content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 22% 20%,rgba(200,148,74,.22),transparent 60%),
    radial-gradient(ellipse 45% 35% at 82% 85%,rgba(200,148,74,.14),transparent 55%),
    radial-gradient(ellipse 60% 50% at 50% 100%,rgba(26,46,74,.5),transparent 60%);
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:scale(1) translate(0,0)}
  to{transform:scale(1.08) translate(-1.5%,1.5%)}
}

/* film grain */
canvas#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay}

.wrap{position:relative;z-index:2;max-width:460px}

.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:#c8944a;
  margin-bottom:1.4rem;opacity:0;animation:riseIn .8s cubic-bezier(.22,.68,0,.71) forwards;
  animation-delay:.1s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.eyebrow::before,.eyebrow::after{content:'';width:22px;height:1px;background:linear-gradient(90deg,transparent,#c8944a)}
.eyebrow::after{background:linear-gradient(90deg,#c8944a,transparent)}

h1{
  font-family:'Playfair Display',Georgia,serif;font-weight:600;
  font-size:clamp(2.1rem,6vw,3rem);letter-spacing:-.02em;line-height:1.12;
  color:#fff;margin-bottom:1rem;
  opacity:0;animation:riseIn .9s cubic-bezier(.22,.68,0,.71) forwards;animation-delay:.26s;
}
h1 em{font-style:italic;font-weight:500;color:#e8c88a}

p.sub{
  font-size:.98rem;color:rgba(255,255,255,.58);line-height:1.75;margin:0 auto 2.5rem;max-width:380px;
  opacity:0;animation:riseIn .9s cubic-bezier(.22,.68,0,.71) forwards;animation-delay:.42s;
}

.links{
  display:flex;justify-content:center;gap:.85rem;flex-wrap:wrap;
  opacity:0;animation:riseIn .9s cubic-bezier(.22,.68,0,.71) forwards;animation-delay:.58s;
}
.links a{
  position:relative;display:inline-flex;align-items:center;gap:9px;
  padding:14px 30px;border-radius:9px;text-decoration:none;
  font-size:.85rem;font-weight:600;letter-spacing:.02em;
  transition:transform .35s cubic-bezier(.22,.68,0,.71),box-shadow .35s ease,border-color .35s ease,background .35s ease,color .35s ease;
}
.links a svg{width:13px;height:13px;flex-shrink:0;transition:transform .3s cubic-bezier(.22,.68,0,.71)}
.links a:hover svg{transform:translateX(3px)}

.links a.primary{background:linear-gradient(135deg,#dcae66,#c8944a);color:#0b1420;box-shadow:0 6px 20px rgba(200,148,74,.28)}
.links a.primary:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(200,148,74,.4)}

.links a.secondary{background:rgba(255,255,255,.04);color:#fff;border:1.5px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.links a.secondary:hover{border-color:#c8944a;color:#e8c88a;background:rgba(200,148,74,.08);transform:translateY(-3px)}

@keyframes riseIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<canvas id="grain"></canvas>
<div class="wrap">
  <div class="eyebrow">Physician &middot; Researcher</div>
  <h1>Otabek Pulatov, <em>MD</em></h1>
  <p class="sub">The rest of the site is being reworked at the moment — here's what's available right now.</p>
  <div class="links">
    <a href="cv.html" class="primary">CV <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></a>
    <a href="research.html" class="secondary">Research <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></a>
  </div>
</div>
<script>
(function grain(){
  const c=document.getElementById('grain');
  const ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight}
  resize();window.addEventListener('resize',resize);
  const tile=document.createElement('canvas');tile.width=140;tile.height=140;
  const tctx=tile.getContext('2d');
  function draw(){
    const id=tctx.createImageData(140,140);
    for(let i=0;i<id.data.length;i+=4){
      const v=Math.random()*255;
      id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=255;
    }
    tctx.putImageData(id,0,0);
    const pattern=ctx.createPattern(tile,'repeat');
    ctx.fillStyle=pattern;ctx.fillRect(0,0,c.width,c.height);
    setTimeout(()=>requestAnimationFrame(draw),110);
  }
  draw();
})();
</script>
</body>
</html>
