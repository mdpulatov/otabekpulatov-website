<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Otabek Pulatov, MD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0f1d2f;--stone:#ece6d8;--warm-white:#faf9f5;--gold:#c8944a;
  --text:#211e19;--text-secondary:#5c5648;--text-light:#948d7c;--border:#e6e0d0;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font-body);color:var(--text);background:var(--warm-white);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.wrap{max-width:460px}
.code{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
h1{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.4rem);font-weight:700;color:var(--navy);margin-bottom:.85rem}
p{font-size:.95rem;color:var(--text-secondary);line-height:1.7;margin-bottom:1.75rem}
a.home{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;background:var(--navy);color:#fff;text-decoration:none;border-radius:8px;font-size:.85rem;font-weight:600;transition:all .25s}
a.home:hover{background:var(--gold);transform:translateY(-2px)}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <div class="code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be broken, or the page has moved. Head back to the homepage to find your way.</p>
  <a class="home" href="/">Back to Home</a>
</div>
</body>
</html>
